{{- if .Values.vaultSecretOperator.enabled }}
# Vault Secrets Operator (HashiCorp VSO): синхронизация одного пути Vault KV в один K8s Secret.
# В Vault по пути должны быть ключи: db-password, db-user, db-host, db-port, db-name
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "donweather-ms-georesolve.fullname" . }}-vault-secret
  labels:
    {{- include "donweather-ms-georesolve.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vaultSecretOperator.vaultAuthRef }}
  mount: {{ .Values.vaultSecretOperator.mount }}
  type: {{ .Values.vaultSecretOperator.type | default "kv-v2" }}
  path: {{ .Values.vaultSecretOperator.path }}
  {{- if .Values.vaultSecretOperator.version }}
  version: {{ .Values.vaultSecretOperator.version }}
  {{- end }}
  refreshAfter: {{ .Values.vaultSecretOperator.refreshAfter | default "1h" }}
  destination:
    name: {{ include "donweather-ms-georesolve.fullname" . }}-secret
    create: true
    overwrite: true
    type: Opaque
{{- end }}
